[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bookends"
version = "0.1.0"
description = "Batch start/stop (bookend) frame generation for LTX-2.5 FLF2V, via Qwen-Image-Edit-2509"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pillow>=10.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
gpu = [
  "torch>=2.4",
  "diffusers",
  "transformers>=4.49,<5",
  "accelerate",
  "safetensors",
  "torchao>=0.8",
]
dev = ["pytest>=8"]

[project.scripts]
bookends = "bookends.__main__:main"

[tool.setuptools.packages.find]
include = ["bookends*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
