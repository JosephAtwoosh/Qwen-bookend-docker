name: Build bookend image

# Builds the bookend generator image on a GitHub-hosted runner (Docker, full
# network, ~28 GB of reclaimable disk) and pushes it to GHCR, where Vast.ai can
# pull it. No local Docker needed, and the default GITHUB_TOKEN is normally enough
# for a public repo -- so no secrets are required.
#
# Mirrors ltx25-docker's build-image.yml so the two images are built the same way.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to push"
        required: true
        default: "latest"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "compose.yaml"
      - "pyproject.toml"
      - "bookends/**"
      - "scripts/**"
      - ".github/workflows/build-image.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/josephatwoosh/qwen-bookend-docker

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The runner has ~22 GB free and the CUDA base alone is ~8 GB unpacked, so
      # reclaim the toolchains this build does not use.
      - name: Free disk space
        run: |
          set -eux
          df -h /
          sudo rm -rf /usr/lib/jvm \
                      /usr/local/.ghcup \
                      /usr/local/lib/android \
                      /usr/local/share/powershell \
                      /usr/share/dotnet \
                      /usr/share/swift \
                      /opt/ghc \
                      "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo docker image prune -af || true
          df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The source label links the package to this repository, which is what lets
      # the package inherit the repository's public visibility.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.event.inputs.tag || 'latest' }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Qwen-bookend-docker
            org.opencontainers.image.description=Bookend (start/stop) frame generation for LTX-2.5 FLF2V via Qwen-Image-Edit-2509
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Pushed"
            echo ""
            echo '```'
            echo "docker pull ${{ env.IMAGE }}:${{ github.event.inputs.tag || 'latest' }}"
            echo '```'
            echo ""
            echo "If the package is private, set its visibility to public in"
            echo "Settings -> Packages, or Vast.ai will not be able to pull it."
          } >> "$GITHUB_STEP_SUMMARY"
